name: Build APKs

# Builds the stock portal-muse probe + app APKs on every push to main,
# and on demand (workflow_dispatch). All builds are signed with the same
# debug keystore (stored as the DEBUG_KEYSTORE_B64 Actions secret) so APK
# updates always install in place on the tablet without wiping app data
# or the Muse pairing.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu runner image already carries an Android SDK
      # (ANDROID_HOME is set); setup-android@v3 is broken against current
      # cmdline-tools (it asks sdkmanager for the removed 'tools' package),
      # so install the exact packages we need directly instead.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Verify restored keystore fingerprint
        run: |
          ls -la ~/.android/
          keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sha256sum
          echo "HOME=$HOME ANDROID_USER_HOME=${ANDROID_USER_HOME:-unset}"
          find "$HOME" -name 'debug.keystore' 2>/dev/null || true

      - name: Test and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :muse:test :wake:test :app:testDebugUnitTest :app:assembleDebug :probe:assembleDebug --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: portal-muse-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/probe/build/outputs/apk/debug/probe-debug.apk
          if-no-files-found: error
